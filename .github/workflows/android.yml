name: APK Android de test

# Construit l'APK Android (Godot 4.7, sans Gradle) :
#  - à chaque pull request et à chaque push sur main : APK dans les « Artifacts » du run ;
#  - sur main (ou lancé à la main) : APK publié dans la pré-version « android-test »,
#    téléchargeable depuis le téléphone :
#    https://github.com/macgama/fanaroundtheworld/releases/download/android-test/FanAroundTheWorld.apk
# Signé avec la clé de test tools/android/test.keystore (pas pour le Play Store).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Godot et modèles d'export (cache)
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android

      - name: Télécharger Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cd ~/godot
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip && rm godot.zip
          mv Godot_v${GODOT_VERSION}-stable_linux.x86_64 godot
          curl -sSL -o tpl.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -q -j tpl.tpz 'templates/android_*' 'templates/version.txt' -d ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/
          rm tpl.tpz

      - name: Réglages Android de Godot
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-${GODOT_VERSION}.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_SDK_ROOT}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOF
          # le préréglage d'export du dépôt (export_presets.cfg reste propre à chaque PC)
          cp tools/android/export_presets.cfg export_presets.cfg
          # numéro de version : un de plus à chaque construction, pour pouvoir mettre à jour l'appli
          sed -i "s/^version\/code=.*/version\/code=${GITHUB_RUN_NUMBER}/" export_presets.cfg

      - name: Import du projet
        run: ~/godot/godot --headless --path . --import || true

      - name: Export de l'APK
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_PATH: ${{ github.workspace }}/tools/android/test.keystore
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: fanaroundtheworld
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: fanaroundtheworld
        run: |
          mkdir -p build/android
          ~/godot/godot --headless --path . --export-release "Android" build/android/FanAroundTheWorld.apk 2>&1 | grep -v "^ADDING:" | tee export.log
          test -f build/android/FanAroundTheWorld.apk
          ls -la build/android
          "${ANDROID_SDK_ROOT}"/build-tools/$(ls "${ANDROID_SDK_ROOT}"/build-tools | sort -V | tail -1)/apksigner verify --print-certs build/android/FanAroundTheWorld.apk | head -3

      - uses: actions/upload-artifact@v4
        with:
          name: FanAroundTheWorld-apk
          path: build/android/FanAroundTheWorld.apk

      - name: Publier dans la pré-version « android-test »
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-test --yes --cleanup-tag || true
          gh release create android-test build/android/FanAroundTheWorld.apk \
            --prerelease --target "${GITHUB_SHA}" \
            --title "APK Android de test" \
            --notes "Construit depuis ${GITHUB_SHA::7} (run ${GITHUB_RUN_NUMBER}). Version de test, signée avec la clé de test : à installer à la main (sources inconnues autorisées). Guide : docs/android.md."
